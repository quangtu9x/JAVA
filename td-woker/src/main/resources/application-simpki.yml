# =====================================================================
# Spring profile "simpki" — bổ sung cho môi trường TEST/triển khai CHỈ chạy module simpki.sign
# (docs/18-trien-khai-test-simpki.md). File MỚI, KHÔNG sửa application.yml hiện có — kích hoạt bằng
# SPRING_PROFILES_ACTIVE=simpki (Spring Boot tự load thêm file này CHỒNG lên application.yml gốc).
#
# Lý do CẦN 1 profile riêng thay vì chỉ dùng biến môi trường (khác các module trước — guinhanquocgia/
# vbdi/vbden chỉ cần biến môi trường, KHÔNG cần file YAML riêng): danh sách worker.rabbit.queues là
# KIỂU LIST — application.yml gốc hard-code "task-type: \"\"" (generic, nhận MỌI taskType) ngay
# trong YAML, KHÔNG phải placeholder ${...}, nên KHÔNG thể đổi qua biến môi trường đơn lẻ. Cách chuẩn
# của Spring Boot để override 1 property kiểu List là khai báo lại TOÀN BỘ list ở 1 property source
# ưu tiên cao hơn (profile-specific file) - đã áp dụng đúng cách đó ở đây.
#
# Vì sao cần TÁCH RIÊNG hàng đợi (không dùng chung "worker.tasks" mặc định): SSL JVM global
# (docs/17-checklist mục 0.4) - khuyến nghị chạy simpki.sign trên 1 Worker INSTANCE RIÊNG, và hàng đợi
# riêng "worker.simpki" chỉ bind đúng routing key "worker.simpki.sign" (KHÔNG nhận nhầm task khác nếu
# sau này có nhiều Worker instance dùng chung 1 broker).
# =====================================================================

worker:
  core:
    # QUAN TRỌNG: 1 lần ký SIM-PKI là đồng bộ, chờ người dùng xác nhận trên điện thoại tới
    # worker.tasks.simpki.timeout-seconds (mặc định 300s, docs/17-checklist). unit-timeout MẶC ĐỊNH
    # của Worker Core (60s, application.yml) NGẮN HƠN nhiều -> MessageFlowRunner#waitForCompletion sẽ
    # Future.cancel(true) (interrupt thread) GIỮA CHỪNG lúc call SOAP đang chờ MSSP/điện thoại, làm
    # hỏng giao dịch ký đang hợp lệ. PHẢI đặt dài hơn timeout-seconds (có biên) - xem
    # docs/18-trien-khai-test-simpki.md mục cấu hình timeout.
    unit-timeout: ${WORKER_UNIT_TIMEOUT:330s}
    # Cùng lý do: lease claim (crash-recovery) không được ngắn hơn thời gian xử lý 1 unit, nếu không
    # 1 Worker instance khác (khi mở rộng nhiều instance) có thể tưởng lease hết hạn và claim lại unit
    # đang xử lý dở dang.
    claim-lease-seconds: ${WORKER_CLAIM_LEASE_SECONDS:360}
    # Môi trường test 1 instance nhỏ - không cần 200 thread mặc định.
    max-inflight-units: ${WORKER_MAX_INFLIGHT:20}

  tasks:
    # Instance này CHỈ chạy simpki.sign - tắt hẳn vbdi/vbden để hàng đợi generic (nếu lỡ còn
    # message cũ) không bị xử lý nhầm ở instance dành riêng cho ký số SIM-PKI. guinhanquocgia đã
    # mặc định tắt (enabled=false) nên không cần khai báo lại. Đổi lại được bằng biến môi trường
    # thường (WORKER_TASKS_VBDI_ENABLED/WORKER_TASKS_VBDEN_ENABLED) nếu 1 instance sau này cần chạy
    # kèm cả 2 - đây chỉ là giá trị MẶC ĐỊNH của profile "simpki", không phải khoá cứng.
    vbdi:
      enabled: ${WORKER_TASKS_VBDI_ENABLED:false}
    vbden:
      enabled: ${WORKER_TASKS_VBDEN_ENABLED:false}

  rabbit:
    queues:
      # Khai báo lại TOÀN BỘ list (thay hẳn queue "worker.tasks"/task-type "" mặc định của
      # application.yml) - hàng đợi RIÊNG chỉ nhận đúng taskType simpki.sign (routing key
      # "worker.simpki.sign", binding CHÍNH XÁC - không dùng wildcard "worker.*").
      #
      # QUAN TRỌNG (bài học rút ra khi viết file này — đã tự bắt bằng test
      # ApplicationSimpkiProfileTest): dùng TÊN BIẾN MÔI TRƯỜNG RIÊNG (WORKER_SIMPKI_QUEUE_*), KHÔNG
      # tái dùng WORKER_RABBIT_QUEUE/WORKER_RABBIT_CONCURRENCY/... của hàng đợi generic — nếu 1 máy
      # nào đó (vd .env dev dùng chung) đã set sẵn WORKER_RABBIT_QUEUE cho hàng đợi "worker.tasks"
      # khác, placeholder ${WORKER_RABBIT_QUEUE:...} ở ĐÂY sẽ vô tình nhận giá trị đó thay vì fallback
      # "worker.simpki" của chính profile này (Spring chỉ có 1 giá trị cho 1 tên biến môi trường,
      # DÙNG CHUNG TÊN nghĩa là 2 nơi cùng đọc 1 giá trị, bất kể fallback trong dấu ':' khác nhau).
      - name: ${WORKER_SIMPKI_QUEUE_NAME:worker.simpki}
        task-type: simpki.sign
        # Mỗi lời gọi sign() chiếm 1 thread TỚI 300s (chờ SIM) - concurrency thấp, KHÔNG dùng số lớn
        # như hàng đợi generic (mặc định 4/8) để tránh giữ quá nhiều thread treo lâu cùng lúc.
        concurrency: ${WORKER_SIMPKI_QUEUE_CONCURRENCY:2}
        max-concurrency: ${WORKER_SIMPKI_QUEUE_MAX_CONCURRENCY:4}
        # Prefetch thấp - broker chỉ giao thêm message mới khi consumer rảnh (mỗi message giữ thread
        # rất lâu, prefetch cao sẽ khiến message dồn ứ chờ mà không ai xử lý được).
        prefetch: ${WORKER_SIMPKI_QUEUE_PREFETCH:2}
        rate-limit-per-second: ${WORKER_SIMPKI_QUEUE_RATE_LIMIT:0}
